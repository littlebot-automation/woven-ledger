lexik_jwt_authentication:
    secret_key: '%env(resolve:JWT_SECRET_KEY)%'
    public_key: '%env(resolve:JWT_PUBLIC_KEY)%'
    pass_phrase: '%env(JWT_PASSPHRASE)%'
    # 30 days. The phone is a personal device on a single-tenant app, and a short
    # expiry would only mean re-typing the password on the shop floor.
    token_ttl: 2592000
